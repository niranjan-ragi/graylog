app:
  name: AppZ-LogCollectorGL
  code: LCGL
  notify: appz@cloudbourne.co

build:
  version: 6.3
  env: DEV
  build_file: none
  output_files: output/*.zip
  image_template: graylog-6.3

deploy:
  context: niranjan-ragi/DEV
  replicas: 1
  type: statefulset
  port:
    - 9000
    - 12201

volumes:
  - claim: graylog-data
    class: microk8s-hostpath
    mode: ReadWriteOnce
    mount: /usr/share/graylog/data/journal
    name: graylog-data
    size: 10Gi


properties:
  GRAYLOG_MONGODB_URI: mongodb://mongodb-8-0:27017/graylog
  GRAYLOG_ELASTICSEARCH_HOSTS: http://elasticsearch-2-15:9200/
  GRAYLOG_ELASTICSEARCH_DISCOVERY_ENABLED: false
  GRAYLOG_ROOT_PASSWORD_SHA2: 2f9acb02faa121bb2a3621951f57b4c690655337edee2e5ac350be2b3be88ea8 
  GRAYLOG_PASSWORD_SECRET : "9Z4meB5gzVAnT1YQYbza"
  OPENSEARCH_INITIAL_ADMIN_PASSWORD : ",N%b|wn4<|Z?>!Eb%rJp:KnD||,0r(EKLjrfg14(hJ;?|hA=-i"
  GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
  GRAYLOG_HTTP_EXTERNAL_URI: https://gl-qa.lowtouchcloud.io/
